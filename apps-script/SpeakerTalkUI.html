<dialog id="speaker-talk-dialog">
  <form id="speaker-talk-form" method="dialog" class="form-panel" data-merge-entity="ORATEUR_DISCOURS">
    <div class="dialog-header">
      <div><p class="eyebrow">Discours déclarés</p><h2 id="speaker-talk-title">Orateur</h2></div>
      <button type="button" class="icon-button" data-close="speaker-talk-dialog">×</button>
    </div>
    <input type="hidden" name="speakerId">
    <input type="hidden" name="version">
    <input id="speaker-talk-search" type="search" placeholder="Rechercher par numéro ou mots du titre...">
    <div id="speaker-talk-list" class="selection-list"></div>
    <div class="form-actions">
      <button type="button" class="secondary-button" data-close="speaker-talk-dialog">Annuler</button>
      <button type="submit" class="primary-button">Enregistrer la liste</button>
    </div>
  </form>
</dialog>

<script>
  state.speakerTalkSelection = null;

  function installSpeakerTalkButton() {
    const actions = document.querySelector('#speaker-form .form-actions');
    if (!actions || document.getElementById('manage-speaker-talks')) return;
    const button = document.createElement('button');
    button.type = 'button';
    button.id = 'manage-speaker-talks';
    button.className = 'secondary-button';
    button.textContent = 'Gérer ses discours';
    actions.prepend(button);
  }

  async function openSpeakerTalks(speakerId) {
    if (!speakerId) {
      toast('Enregistre d’abord la fiche de l’orateur.');
      return;
    }
    try {
      state.speakerTalkSelection = await runServer('getSpeakerTalkSelection', speakerId);
      const dialog = document.getElementById('speaker-talk-dialog');
      const form = document.getElementById('speaker-talk-form');
      form.elements.speakerId.value = speakerId;
      form.elements.version.value = state.speakerTalkSelection.version || '';
      const selected = state.speakerTalkSelection.talks.filter(item => item.selected).map(item => item.number);
      rememberConcurrentMergeBase_(form, 'ORATEUR_DISCOURS', speakerId, { talkNumbers: selected });
      document.getElementById('speaker-talk-title').textContent = state.speakerTalkSelection.speaker.fullName || state.speakerTalkSelection.speaker.lastName;
      document.getElementById('speaker-talk-search').value = '';
      renderSpeakerTalkSelection();
      dialog.showModal();
    } catch (error) { showError(error); }
  }

  function renderSpeakerTalkSelection() {
    const container = document.getElementById('speaker-talk-list');
    const query = String(document.getElementById('speaker-talk-search').value || '').toLowerCase();
    const talks = (state.speakerTalkSelection ? state.speakerTalkSelection.talks : [])
      .filter(item => !query || String(item.number).includes(query) || String(item.title).toLowerCase().includes(query));
    if (!talks.length) {
      container.innerHTML = '<div class="empty-state">Aucun discours trouvé.</div>';
      return;
    }
    container.innerHTML = talks.map(item => `
      <label class="selection-row">
        <input type="checkbox" value="${item.number}" ${item.selected ? 'checked' : ''}>
        <span><strong>N° ${item.number}</strong><small>${escapeHtml(item.title)}</small></span>
      </label>`).join('');
  }

  function invalidatePlanningOptionsAfterSpeakerTalks_() {
    invalidatePlanningDependentCaches_();
    if (state.automaticPlanningDraft) state.automaticPlanningDraft = null;
  }

  document.addEventListener('click', event => {
    if (event.target.id === 'manage-speaker-talks') {
      openSpeakerTalks(document.getElementById('speaker-form').elements.id.value);
    }
  });

  document.getElementById('speaker-talk-search').addEventListener('input', renderSpeakerTalkSelection);

  document.getElementById('speaker-talk-form').addEventListener('change', event => {
    if (!event.target.matches('input[type="checkbox"]') || !state.speakerTalkSelection) return;
    const number = Number(event.target.value);
    const item = state.speakerTalkSelection.talks.find(talk => talk.number === number);
    if (item) item.selected = event.target.checked;
  });

  document.getElementById('speaker-talk-form').addEventListener('submit', async event => {
    event.preventDefault();
    const form = event.target;
    const speakerId = form.elements.speakerId.value;
    const selected = state.speakerTalkSelection.talks.filter(item => item.selected).map(item => item.number);
    try {
      await runServer('saveSpeakerTalkSelection', speakerId, selected, form.elements.version.value);
      document.getElementById('speaker-talk-dialog').close();
      toast('Liste des discours enregistrée.');
      invalidatePlanningOptionsAfterSpeakerTalks_();
    } catch (error) {
      if (isConcurrentVersionConflict_(error)) {
        await handleConcurrentFormConflict_(form, { talkNumbers: selected }, {
          onSaved: async () => {
            document.getElementById('speaker-talk-dialog').close();
            toast('Listes de discours fusionnées et enregistrées.');
            invalidatePlanningOptionsAfterSpeakerTalks_();
          }
        });
      } else showError(error);
    }
  });

  document.addEventListener('DOMContentLoaded', installSpeakerTalkButton);
</script>
