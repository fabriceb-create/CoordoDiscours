<style>
  .integrity-panel{margin-top:18px;padding-top:18px;border-top:1px solid #e4e8ef}.integrity-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.integrity-summary{margin:12px 0;padding:12px;border-radius:10px;background:#f5f7fa}.integrity-summary.ok{background:#ecfdf3}.integrity-summary.error{background:#fef3f2}.integrity-list{display:grid;gap:8px;margin-top:12px}.integrity-item{padding:10px;border:1px solid #e4e8ef;border-radius:10px;background:#fff}.integrity-item strong{display:block;margin-bottom:4px}.integrity-item small{color:#667085;word-break:break-word}
</style>
<script>
  let settingsLoaded = false;
  let currentLanguage = 'fr';
  let currentTranslations = {};
  let translationObserver;
  let currentSettingsData = null;

  function t(text) {
    return currentTranslations[String(text || '')] || String(text || '');
  }

  async function setInterfaceLanguage(language) {
    try {
      const pack = await runServer('getLanguagePack', language || '');
      currentLanguage = pack.code || 'fr';
      currentTranslations = pack.translations || {};
      document.documentElement.lang = currentLanguage === 'gcf' ? 'gcf' : 'fr';
      applyTranslations(document.body);
      startTranslationObserver_();
      return pack;
    } catch (error) {
      showError(error);
      return null;
    }
  }

  function applyTranslations(root) {
    if (!root || currentLanguage === 'fr') return;
    translateElement_(root);
    root.querySelectorAll('*').forEach(translateElement_);
  }

  function translateElement_(element) {
    if (!element || element.closest('[data-no-translate]')) return;
    if (element.placeholder && currentTranslations[element.placeholder]) element.placeholder = currentTranslations[element.placeholder];
    if (element.title && currentTranslations[element.title]) element.title = currentTranslations[element.title];
    Array.from(element.childNodes || []).forEach(node => {
      if (node.nodeType !== Node.TEXT_NODE) return;
      const raw = node.nodeValue || '';
      const trimmed = raw.trim();
      if (!trimmed || !currentTranslations[trimmed]) return;
      node.nodeValue = raw.replace(trimmed, currentTranslations[trimmed]);
    });
  }

  function startTranslationObserver_() {
    if (translationObserver) translationObserver.disconnect();
    translationObserver = new MutationObserver(mutations => {
      if (currentLanguage === 'fr') return;
      mutations.forEach(mutation => mutation.addedNodes.forEach(node => {
        if (node.nodeType === Node.ELEMENT_NODE) applyTranslations(node);
        if (node.nodeType === Node.TEXT_NODE && node.parentElement) translateElement_(node.parentElement);
      }));
    });
    translationObserver.observe(document.body, { childList: true, subtree: true });
  }

  async function loadSettings() {
    const container = document.getElementById('settings-content');
    if (!container) return;
    container.innerHTML = '<div class="empty-state">' + t('Chargement des paramètres...') + '</div>';
    try {
      renderSettings(await runServer('getApplicationSettings'));
      settingsLoaded = true;
      applyTranslations(container);
    } catch (error) {
      showError(error);
      container.innerHTML = '<div class="empty-state">' + t('Impossible de charger les paramètres.') + '</div>';
    }
  }

  function settingsMapFromData_(data) {
    return (data.settings || []).reduce((map, item) => { map[item.key] = String(item.value ?? ''); return map; }, {});
  }

  function settingsDefaultsFromData_(data) {
    return (data.settings || []).reduce((map, item) => { map[item.key] = String(item.defaultValue ?? ''); return map; }, {});
  }

  function renderSettings(data) {
    currentSettingsData = cloneConcurrentMergeValue_(data);
    const container = document.getElementById('settings-content');
    const diagnostic = data.diagnostics || {};
    const canAdminister = typeof currentAccess === 'undefined' || !currentAccess ? true : Boolean(currentAccess.canAdminister);
    container.innerHTML = `
      <form id="settings-form" class="settings-layout" data-merge-entity="PARAMETRES">
        <input type="hidden" name="version" value="${escapeHtml(data.settingsVersion || '')}">
        <section class="settings-panel">
          <div class="panel-heading"><div><p class="eyebrow">${t('Configuration')}</p><h2>${t('Réglages généraux')}</h2></div><span class="version-badge">${escapeHtml(data.version || '')}</span></div>
          <div class="settings-grid">${(data.settings || []).map(renderSettingField_).join('')}</div>
          <div class="form-actions settings-actions">
            <button id="settings-reset" type="button" class="secondary-button">${t('Valeurs par défaut')}</button>
            <button type="submit" class="primary-button">${t('Enregistrer les paramètres')}</button>
          </div>
        </section>
        <aside class="settings-panel diagnostics-panel">
          <div class="panel-heading"><div><p class="eyebrow">${t('Diagnostic')}</p><h2>${diagnostic.ok ? t('Configuration valide') : t('Action nécessaire')}</h2></div><span class="health-dot ${diagnostic.ok ? 'ok' : 'error'}"></span></div>
          <dl class="diagnostic-list">
            <div><dt>${t('Base de données')}</dt><dd>${escapeHtml(diagnostic.databaseName || '')}</dd></div>
            <div><dt>${t('Fuseau horaire')}</dt><dd>${escapeHtml(diagnostic.timezone || '')}</dd></div>
            <div><dt>${t('Feuilles disponibles')}</dt><dd>${escapeHtml(diagnostic.sheetCount || 0)} / ${escapeHtml(diagnostic.expectedSheetCount || 0)}</dd></div>
          </dl>
          ${(diagnostic.missingSheets || []).length ? `<div class="warning-box"><strong>${t('Feuilles manquantes')}</strong><br>${diagnostic.missingSheets.map(escapeHtml).join(', ')}</div>` : '<div class="settings-success">' + t('Toutes les feuilles nécessaires sont présentes.') + '</div>'}
          <a class="secondary-button settings-database-link" href="${escapeHtml(data.spreadsheetUrl || '#')}" target="_blank">${t('Ouvrir la base de données')}</a>
          ${canAdminister ? `<section class="integrity-panel"><div class="integrity-head"><div><p class="eyebrow">${t('Intégrité')}</p><strong>${t('Contrôle des données')}</strong></div><button id="run-integrity-check" type="button" class="secondary-button">${t('Analyser')}</button></div><div id="integrity-results" class="integrity-summary">${t('Aucun contrôle lancé.')}</div></section>` : ''}
        </aside>
      </form>`;

    const form = document.getElementById('settings-form');
    form._settingsDefaults = settingsDefaultsFromData_(data);
    rememberConcurrentMergeBase_(form, 'PARAMETRES', 'APPLICATION', settingsMapFromData_(data));
    form.addEventListener('submit', saveSettings_);
    document.getElementById('settings-reset').addEventListener('click', resetSettings_);
    const integrityButton = document.getElementById('run-integrity-check');
    if (integrityButton) integrityButton.addEventListener('click', runIntegrityCheck_);
  }

  function renderSettingField_(setting) {
    const name = escapeHtml(setting.key);
    const value = String(setting.value ?? '');
    let control = '';
    if (setting.type === 'boolean') {
      control = `<select name="${name}"><option value="OUI" ${value === 'OUI' ? 'selected' : ''}>${t('Oui')}</option><option value="NON" ${value === 'NON' ? 'selected' : ''}>${t('Non')}</option></select>`;
    } else if (setting.type === 'select') {
      control = `<select name="${name}">${(setting.options || []).map(option => {
        const label = setting.optionLabels && setting.optionLabels[option] ? setting.optionLabels[option] : String(option) + (setting.suffix ? ' ' + setting.suffix : '');
        return `<option value="${escapeHtml(option)}" ${String(option) === value ? 'selected' : ''}>${escapeHtml(t(label))}</option>`;
      }).join('')}</select>`;
    } else {
      control = `<div class="setting-input-wrap"><input name="${name}" type="${escapeHtml(setting.type || 'text')}" value="${escapeHtml(value)}" ${setting.min != null ? `min="${setting.min}"` : ''} ${setting.max != null ? `max="${setting.max}"` : ''} required>${setting.suffix ? `<span>${escapeHtml(t(setting.suffix))}</span>` : ''}</div>`;
    }
    return `<label class="setting-field"><span><strong>${escapeHtml(t(setting.label))}</strong><small>${escapeHtml(t(setting.description || ''))}</small></span>${control}</label>`;
  }

  async function runIntegrityCheck_() {
    const results = document.getElementById('integrity-results');
    const button = document.getElementById('run-integrity-check');
    if (!results || !button) return;
    button.disabled = true;
    results.className = 'integrity-summary';
    results.textContent = t('Analyse en cours...');
    try {
      const report = await runServer('getDataIntegrityReport');
      results.className = 'integrity-summary ' + (report.ok ? 'ok' : 'error');
      results.innerHTML = `<strong>${report.ok ? t('Aucune anomalie bloquante détectée.') : escapeHtml(report.counts.issues + ' anomalie(s) détectée(s).')}</strong><div class="integrity-list">${(report.issues || []).map(issue => `<article class="integrity-item"><strong>${escapeHtml(issue.message || issue.code)}</strong><small>${escapeHtml(JSON.stringify(issue.details || {}))}</small></article>`).join('')}</div>`;
      if (report.ok) toast(t('Contrôle d’intégrité terminé.'));
    } catch (error) {
      showError(error);
      results.className = 'integrity-summary error';
      results.textContent = t('Le contrôle d’intégrité a échoué.');
    } finally {
      button.disabled = false;
    }
  }

  async function applySettingsSaveResult_(data, requestedLanguage, message) {
    const nextLanguage = requestedLanguage || data.language || 'fr';
    if (nextLanguage !== currentLanguage) { window.location.reload(); return; }
    renderSettings(data);
    const map = settingsMapFromData_(data);
    document.getElementById('congregation').textContent = map.ASSEMBLEE || 'Basse-Terre';
    invalidatePlanningDependentCaches_();
    if (state.automaticPlanningDraft) state.automaticPlanningDraft = null;
    toast(t(message || 'Paramètres enregistrés.'));
    if (typeof loadDashboard === 'function') loadDashboard();
  }

  async function saveSettings_(event) {
    event.preventDefault();
    const form = event.currentTarget;
    const payload = Object.fromEntries(new FormData(form).entries());
    const requestedLanguage = payload.LANGUE_INTERFACE || 'fr';
    try {
      const data = await runServer('saveApplicationSettings', payload);
      await applySettingsSaveResult_(data, requestedLanguage, 'Paramètres enregistrés.');
    } catch (error) {
      if (isConcurrentVersionConflict_(error)) {
        const local = Object.assign({}, payload);
        delete local.version;
        await handleConcurrentFormConflict_(form, local, {
          onSaved: async response => { await applySettingsSaveResult_(response.result, requestedLanguage, 'Paramètres fusionnés et enregistrés.'); }
        });
      } else showError(error);
    }
  }

  async function resetSettings_() {
    if (!confirm(t('Rétablir toutes les valeurs par défaut ?'))) return;
    const form = document.getElementById('settings-form');
    const expectedVersion = form && form.elements.version ? form.elements.version.value : '';
    const defaults = cloneConcurrentMergeValue_(form && form._settingsDefaults || {});
    try {
      const data = await runServer('resetApplicationSettings', expectedVersion);
      await applySettingsSaveResult_(data, data.language || 'fr', 'Valeurs par défaut restaurées.');
    } catch (error) {
      if (isConcurrentVersionConflict_(error)) {
        await handleConcurrentFormConflict_(form, defaults, {
          onSaved: async response => { await applySettingsSaveResult_(response.result, response.result.language || 'fr', 'Valeurs par défaut fusionnées et restaurées.'); }
        }, { operation: 'RESET' });
      } else showError(error);
    }
  }

  document.addEventListener('coordodiscours:viewchange', event => {
    if (event.detail && event.detail.name === 'settings') loadSettings();
  });

  document.addEventListener('DOMContentLoaded', async () => { await setInterfaceLanguage(''); });
</script>
