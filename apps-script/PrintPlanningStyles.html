<style>
  .print-toolbar { display: grid; grid-template-columns: 1fr 180px auto auto; gap: 12px; align-items: end; margin-bottom: 20px; }
  .print-toolbar label { display: grid; gap: 6px; font-weight: 700; font-size: .9rem; }
  .print-preview-shell { overflow: auto; padding: 18px; border-radius: 16px; background: #dfe5ee; }
  .print-document { width: min(100%, 1000px); margin: 0 auto; padding: 34px; background: white; color: #172033; box-shadow: 0 8px 28px rgba(31,48,80,.12); }
  .print-header { text-align: center; border-bottom: 2px solid #172033; padding-bottom: 18px; margin-bottom: 24px; }
  .print-header p { margin-bottom: 6px; font-weight: 700; }
  .print-header h1 { margin-bottom: 8px; }
  .print-months { display: grid; gap: 24px; }
  .print-month-block { break-inside: avoid; }
  .print-month-block h2 { padding: 8px 12px; background: #edf1f8; text-transform: capitalize; }
  .print-table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  .print-table th, .print-table td { border: 1px solid #aeb9ca; padding: 9px 10px; text-align: left; vertical-align: top; }
  .print-table th { background: #f5f7fa; }
  .print-empty { padding: 14px; border: 1px dashed #b9c3d2; color: #65718a; }
  @media (max-width: 820px) { .print-toolbar { grid-template-columns: 1fr; } .print-document { padding: 20px; } }
  @media print {
    body { background: white !important; }
    .sidebar, .topbar, .section-header, .print-toolbar, #toast { display: none !important; }
    .layout, .main-content, .view, #view-print { display: block !important; padding: 0 !important; margin: 0 !important; }
    .view:not(#view-print) { display: none !important; }
    .print-preview-shell { padding: 0; background: white; overflow: visible; }
    .print-document { width: 100%; padding: 0; box-shadow: none; }
    @page { size: A4 landscape; margin: 12mm; }
  }
</style>
