<style>
  :root {
    font-family: Inter, Arial, sans-serif;
    color: #172033;
    background: #f4f7fb;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: #f4f7fb; }
  body.navigation-open { overflow: hidden; }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .62; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
    outline: 3px solid #f4b400;
    outline-offset: 3px;
  }
  .skip-link {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 100;
    padding: 10px 14px;
    border-radius: 10px;
    background: #fff;
    color: #172033;
    font-weight: 800;
    text-decoration: none;
    box-shadow: 0 8px 24px rgba(17,28,49,.25);
    transform: translateY(-160%);
    transition: transform .18s ease;
  }
  .skip-link:focus { transform: translateY(0); }
  .layout { min-height: 100vh; display: grid; grid-template-columns: 250px minmax(0,1fr); }
  .sidebar {
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    padding: 24px 18px;
    background: #172033;
    color: white;
    display: flex;
    flex-direction: column;
    gap: 28px;
    z-index: 40;
  }
  .sidebar-head, .topbar-main { display: flex; gap: 12px; align-items: center; }
  .sidebar-head { justify-content: space-between; }
  .brand { display: flex; gap: 12px; align-items: center; min-width: 0; }
  .brand-mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; background: #7fa6ff; color: #172033; font-weight: 800; flex: 0 0 auto; }
  .brand strong, .brand small { display: block; }
  .brand strong { overflow-wrap: anywhere; }
  .brand small { margin-top: 4px; opacity: .7; }
  nav { display: grid; gap: 8px; }
  .nav-button { width: 100%; border: 0; border-radius: 10px; padding: 12px 14px; text-align: left; background: transparent; color: #dce5f7; }
  .nav-button:hover, .nav-button.active { background: rgba(255,255,255,.12); color: white; }
  .nav-button[aria-current='page'] { box-shadow: inset 3px 0 #7fa6ff; }
  .database-link { margin-top: auto; color: #dce5f7; text-decoration: none; font-size: .92rem; }
  .mobile-menu-toggle, .mobile-menu-close, .sidebar-backdrop { display: none; }
  .main-content { padding: 30px; min-width: 0; }
  .main-content:focus { outline: 0; }
  .topbar, .section-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
  .topbar-main { min-width: 0; }
  h1, h2, h3, p { margin-top: 0; }
  h1 { margin-bottom: 0; font-size: 1.9rem; overflow-wrap: anywhere; }
  h2 { margin-bottom: 6px; }
  .eyebrow { margin-bottom: 6px; font-size: .76rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #65718a; }
  .status-pill { padding: 8px 12px; border-radius: 999px; background: #e8f6ed; color: #17643a; font-weight: 700; font-size: .85rem; text-align: center; }
  .view { display: none; }
  .active-view { display: block; }
  .hero-card, .toolbar, .record-card, dialog { border: 1px solid #e2e8f2; background: white; box-shadow: 0 10px 30px rgba(32,49,82,.07); }
  .hero-card { padding: 28px; border-radius: 18px; }
  .module-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 18px; margin-top: 22px; }
  .module-card { border: 1px solid #e2e8f2; border-radius: 16px; padding: 22px; background: white; text-align: left; }
  .module-card span { font-size: 1.5rem; }
  .module-card h3 { margin: 12px 0 8px; }
  .module-card p { margin: 0; color: #65718a; }
  .primary-button, .secondary-button, .danger-button { min-height: 42px; padding: 0 16px; border-radius: 10px; border: 0; font-weight: 700; }
  .primary-button { background: #274690; color: white; }
  .secondary-button { background: #edf1f8; color: #26334d; }
  .danger-button { background: #fff0f0; color: #a62e2e; }
  .toolbar { display: flex; align-items: center; gap: 16px; padding: 14px; border-radius: 14px; margin-bottom: 18px; }
  .toolbar input[type='search'] { flex: 1; }
  input, select, textarea { width: 100%; border: 1px solid #cfd8e8; border-radius: 9px; padding: 10px 12px; background: white; }
  .toolbar label { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .toolbar input[type='checkbox'], .checkbox-field input { width: auto; }
  .cards-list { display: grid; gap: 12px; }
  .record-card { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 18px; padding: 18px; border-radius: 14px; }
  .record-card.archived { opacity: .65; }
  .record-card h3 { margin-bottom: 5px; overflow-wrap: anywhere; }
  .record-meta { color: #65718a; line-height: 1.55; overflow-wrap: anywhere; }
  .record-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .empty-state { padding: 34px; border: 1px dashed #cfd8e8; border-radius: 14px; text-align: center; color: #65718a; background: rgba(255,255,255,.65); }
  dialog { width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 32px); border-radius: 18px; padding: 0; overflow: hidden; }
  dialog::backdrop { background: rgba(17,28,49,.48); }
  .form-panel { max-height: calc(100vh - 34px); overflow-y: auto; padding: 22px; }
  .dialog-header, .form-actions { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .dialog-header { margin-bottom: 18px; }
  .dialog-header h2 { margin: 0; }
  .icon-button { width: 40px; height: 40px; border: 0; border-radius: 50%; background: #edf1f8; color: #26334d; font-size: 1.35rem; display: grid; place-items: center; flex: 0 0 auto; }
  .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
  .form-grid label { display: grid; gap: 6px; font-weight: 700; font-size: .9rem; }
  .full-width { grid-column: 1 / -1; }
  .checkbox-field { display: flex !important; align-items: center; gap: 8px; }
  .form-actions { justify-content: flex-end; margin-top: 20px; }
  .warning-box { margin-top: 16px; padding: 14px 16px; border: 1px solid #f0c36b; border-radius: 12px; background: #fff8e8; color: #6f4a00; line-height: 1.45; }
  .warning-box ul { margin: 8px 0 0; padding-left: 20px; }
  .toast { position: fixed; right: 24px; bottom: 24px; z-index: 80; max-width: 360px; padding: 14px 18px; border-radius: 12px; background: #172033; color: white; box-shadow: 0 12px 30px rgba(0,0,0,.2); }
  .toast[data-tone='error'] { background: #8f2525; }

  .network-recovery { display:flex; align-items:center; justify-content:space-between; gap:16px; margin:-8px 0 20px; padding:14px 16px; border:1px solid #e6a23c; border-radius:13px; background:#fff8e8; color:#604400; box-shadow:0 8px 24px rgba(96,68,0,.08); }
  .network-recovery[hidden] { display:none; }
  .network-recovery strong, .network-recovery span { display:block; }
  .network-recovery span { margin-top:4px; line-height:1.45; }
  .network-recovery[data-mode='uncertain'] { border-color:#e28a8a; background:#fff0f0; color:#7d2525; }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: min(86vw, 320px);
      height: 100dvh;
      transform: translateX(-105%);
      transition: transform .22s ease;
      box-shadow: 14px 0 36px rgba(0,0,0,.25);
      overscroll-behavior: contain;
    }
    body.navigation-open .sidebar { transform: translateX(0); }
    .sidebar-backdrop {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 35;
      border: 0;
      background: rgba(17,28,49,.52);
    }
    .sidebar-backdrop[hidden] { display: none; }
    .mobile-menu-toggle, .mobile-menu-close { display: grid; }
    nav { grid-template-columns: 1fr; }
    .main-content { padding: 16px; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      margin: -16px -16px 20px;
      padding: 12px 16px;
      background: rgba(244,247,251,.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #e2e8f2;
    }
    .topbar-main { flex: 1; }
    .topbar h1 { font-size: 1.35rem; }
    .status-pill { max-width: 42%; }
    .topbar-actions { margin-left:auto; }
    .network-recovery { align-items:stretch; flex-direction:column; }
    .module-grid, .form-grid { grid-template-columns: 1fr; }
    .full-width { grid-column: auto; }
    .record-card { grid-template-columns: 1fr; }
    .topbar, .section-header, .toolbar { align-items: stretch; }
    .section-header, .toolbar { flex-direction: column; }
    .record-actions { width: 100%; }
    dialog { width: calc(100vw - 16px); max-height: calc(100dvh - 16px); border-radius: 14px; }
    .form-panel { max-height: calc(100dvh - 18px); padding: 18px; }
    .toast { left: 12px; right: 12px; bottom: 12px; max-width: none; }
  }

  @media (max-width: 480px) {
    .section-header .record-actions, .form-actions { flex-direction: column-reverse; align-items: stretch; }
    .section-header .record-actions > button, .form-actions > button:not(.icon-button) { width: 100%; }
    .status-pill { display: none; }
    .topbar-actions { margin-left:auto; }
    .empty-state { padding: 24px 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }

  @media (forced-colors: active) {
    .nav-button[aria-current='page'] { border-left: 3px solid CanvasText; }
    .sidebar-backdrop { background: Canvas; opacity: .7; }
  }
</style>
