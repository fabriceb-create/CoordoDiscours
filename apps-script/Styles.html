<style>
  :root { font-family: Inter, Arial, sans-serif; color: #172033; background: #f4f7fb; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f7fb; }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  .layout { min-height: 100vh; display: grid; grid-template-columns: 250px 1fr; }
  .sidebar { padding: 24px 18px; background: #172033; color: white; display: flex; flex-direction: column; gap: 28px; }
  .brand { display: flex; gap: 12px; align-items: center; }
  .brand-mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; background: #7fa6ff; color: #172033; font-weight: 800; }
  .brand strong, .brand small { display: block; }
  .brand small { margin-top: 4px; opacity: .7; }
  nav { display: grid; gap: 8px; }
  .nav-button { width: 100%; border: 0; border-radius: 10px; padding: 12px 14px; text-align: left; background: transparent; color: #dce5f7; }
  .nav-button:hover, .nav-button.active { background: rgba(255,255,255,.12); color: white; }
  .database-link { margin-top: auto; color: #dce5f7; text-decoration: none; font-size: .92rem; }
  .main-content { padding: 30px; min-width: 0; }
  .topbar, .section-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
  h1, h2, h3, p { margin-top: 0; }
  h1 { margin-bottom: 0; font-size: 1.9rem; }
  h2 { margin-bottom: 6px; }
  .eyebrow { margin-bottom: 6px; font-size: .76rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #65718a; }
  .status-pill { padding: 8px 12px; border-radius: 999px; background: #e8f6ed; color: #17643a; font-weight: 700; font-size: .85rem; }
  .view { display: none; }
  .active-view { display: block; }
  .hero-card, .toolbar, .record-card, dialog { border: 1px solid #e2e8f2; background: white; box-shadow: 0 10px 30px rgba(32,49,82,.07); }
  .hero-card { padding: 28px; border-radius: 18px; }
  .module-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 18px; margin-top: 22px; }
  .module-card { border: 1px solid #e2e8f2; border-radius: 16px; padding: 22px; background: white; text-align: left; }
  .module-card span { font-size: 1.5rem; }
  .module-card h3 { margin: 12px 0 8px; }
  .module-card p { margin: 0; color: #65718a; }
  .primary-button, .secondary-button, .danger-button { min-height: 42px; padding: 0 16px; border-radius: 10px; border: 0; font-weight: 700; }
  .primary-button { background: #274690; color: white; }
  .secondary-button { background: #edf1f8; color: #26334d; }
  .danger-button { background: #fff0f0; color: #a62e2e; }
  .toolbar { display: flex; align-items: center; gap: 16px; padding: 14px; border-radius: 14px; margin-bottom: 18px; }
  .toolbar input[type='search'] { flex: 1; }
  input, select, textarea { width: 100%; border: 1px solid #cfd8e8; border-radius: 9px; padding: 10px 12px; background: white; }
  .toolbar label { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .toolbar input[type='checkbox'], .checkbox-field input { width: auto; }
  .cards-list { display: grid; gap: 12px; }
  .record-card { display: grid; grid-template-columns: 1fr auto; gap: 18px; padding: 18px; border-radius: 14px; }
  .record-card.archived { opacity: .65; }
  .record-card h3 { margin-bottom: 5px; }
  .record-meta { color: #65718a; line-height: 1.55; }
  .record-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .empty-state { padding: 34px; border: 1px dashed #cfd8e8; border-radius: 14px; text-align: center; color: #65718a; background: rgba(255,255,255,.65); }
  dialog { width: min(720px, calc(100vw - 32px)); border-radius: 18px; padding: 0; }
  dialog::backdrop { background: rgba(17,28,49,.48); }
  .form-panel { padding: 22px; }
  .dialog-header, .form-actions { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .dialog-header { margin-bottom: 18px; }
  .dialog-header h2 { margin: 0; }
  .icon-button { width: 36px; height: 36px; border: 0; border-radius: 50%; background: #edf1f8; font-size: 1.4rem; }
  .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
  .form-grid label { display: grid; gap: 6px; font-weight: 700; font-size: .9rem; }
  .full-width { grid-column: 1 / -1; }
  .checkbox-field { display: flex !important; align-items: center; gap: 8px; }
  .form-actions { justify-content: flex-end; margin-top: 20px; }
  .toast { position: fixed; right: 24px; bottom: 24px; z-index: 20; max-width: 360px; padding: 14px 18px; border-radius: 12px; background: #172033; color: white; box-shadow: 0 12px 30px rgba(0,0,0,.2); }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: static; }
    nav { grid-template-columns: repeat(3,1fr); }
    .main-content { padding: 20px; }
    .module-grid, .form-grid { grid-template-columns: 1fr; }
    .full-width { grid-column: auto; }
    .record-card { grid-template-columns: 1fr; }
    .topbar, .section-header, .toolbar { align-items: stretch; flex-direction: column; }
  }
</style>
