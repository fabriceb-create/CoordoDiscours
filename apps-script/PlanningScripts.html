<script>
  state.plannings = [];
  state.planningOptions = { speakers: [], talks: [], congregations: [] };
  let recommendationRequestId = 0;

  async function loadPlanningOptions() {
    state.planningOptions = await runServer('getPlanningOptions');
    const form = document.getElementById('planning-form');
    const speakerSelect = form.elements.speakerId;
    const talkSelect = form.elements.talkNumber;
    const congregationSelect = form.elements.originCongregationId;
    const currentSpeaker = speakerSelect.value;
    const currentTalk = talkSelect.value;
    const currentCongregation = congregationSelect ? congregationSelect.value : '';
    speakerSelect.innerHTML = '<option value="">Sélectionner un orateur</option>' +
      state.planningOptions.speakers.map(item => `<option value="${item.id}">${escapeHtml(item.fullName || item.lastName)}${item.congregationName ? ' - ' + escapeHtml(item.congregationName) : ''}</option>`).join('');
    talkSelect.innerHTML = '<option value="">Sélectionner un discours</option>' +
      state.planningOptions.talks.map(item => `<option value="${item.number}">N° ${item.number} - ${escapeHtml(item.title)}</option>`).join('');
    if (congregationSelect) {
      congregationSelect.innerHTML = '<option value="">Aucune</option>' +
        state.planningOptions.congregations.map(item => `<option value="${item.id}">${escapeHtml(item.name)}</option>`).join('');
    }
    speakerSelect.value = currentSpeaker;
    talkSelect.value = currentTalk;
    if (congregationSelect) congregationSelect.value = currentCongregation;
  }

  async function loadPlannings() {
    try {
      state.plannings = await runServer(
        'listPlannings',
        document.getElementById('planning-search').value,
        document.getElementById('planning-cancelled').checked
      );
      renderPlannings();
    } catch (error) { showError(error); }
  }

  function renderPlannings() {
    const container = document.getElementById('planning-list');
    if (!state.plannings.length) {
      container.innerHTML = '<div class="empty-state">Aucune programmation trouvée.</div>';
      return;
    }
    container.innerHTML = state.plannings.map(item => `
      <article class="record-card ${item.status === 'ANNULE' ? 'archived' : ''}">
        <div>
          <p class="eyebrow">${escapeHtml(item.displayDate)} à ${escapeHtml(item.time)}</p>
          <h3>${escapeHtml(item.speakerName)}</h3>
          <div class="record-meta">Discours n° ${item.talkNumber} - ${escapeHtml(item.talkTitle || 'Titre à compléter')}<br>Statut : ${escapeHtml(item.status)}${item.notes ? '<br>' + escapeHtml(item.notes) : ''}</div>
        </div>
        <div class="record-actions">
          <button class="secondary-button" data-edit-planning="${item.id}">Modifier</button>
          <button class="${item.status === 'ANNULE' ? 'secondary-button' : 'danger-button'}" data-toggle-planning="${item.id}" data-version="${escapeHtml(item.version || '')}" data-status="${item.status}">${item.status === 'ANNULE' ? 'Restaurer' : 'Annuler'}</button>
        </div>
      </article>`).join('');
  }

  function ensurePlanningVersionField_() {
    const form = document.getElementById('planning-form');
    let field = form.elements.version;
    if (!field) {
      field = document.createElement('input');
      field.type = 'hidden';
      field.name = 'version';
      form.appendChild(field);
    }
    return field;
  }

  function isPlanningVersionConflict_(error) {
    return isConcurrentVersionConflict_(error);
  }

  function ensureRecommendationPanel_() {
    let panel = document.getElementById('speaker-recommendations');
    if (panel) return panel;
    const warning = document.getElementById('planning-warning');
    panel = document.createElement('section');
    panel.id = 'speaker-recommendations';
    panel.style.marginTop = '14px';
    panel.innerHTML = '<div class="empty-state">Sélectionne une date et un discours pour afficher les meilleurs orateurs.</div>';
    warning.parentNode.insertBefore(panel, warning);
    return panel;
  }

  async function refreshSpeakerRecommendations_() {
    const panel = ensureRecommendationPanel_();
    const form = document.getElementById('planning-form');
    const payload = formToObject(form);
    if (!payload.date || !payload.talkNumber) {
      panel.innerHTML = '<div class="empty-state">Sélectionne une date et un discours pour afficher les meilleurs orateurs.</div>';
      return;
    }
    const requestId = ++recommendationRequestId;
    panel.innerHTML = '<div class="empty-state">Analyse des orateurs disponibles...</div>';
    try {
      const result = await runServer('getSpeakerRecommendations', payload);
      if (requestId !== recommendationRequestId) return;
      renderSpeakerRecommendations_(result);
    } catch (error) {
      if (requestId !== recommendationRequestId) return;
      panel.innerHTML = '<div class="warning-box">Impossible de calculer les recommandations.</div>';
      showError(error);
    }
  }

  function renderSpeakerRecommendations_(result) {
    const panel = ensureRecommendationPanel_();
    const items = result.recommendations || [];
    if (!items.length) {
      panel.innerHTML = `<div class="empty-state">${escapeHtml(result.message || 'Aucune recommandation disponible.')}</div>`;
      return;
    }
    panel.innerHTML = `
      <div class="panel-heading"><div><p class="eyebrow">Aide au choix</p><h3>Orateurs recommandés</h3></div><span class="version-badge">${items.length} proposition${items.length > 1 ? 's' : ''}</span></div>
      <div class="cards-list">${items.slice(0, 6).map((item, index) => `
        <article class="record-card" style="padding:12px">
          <div>
            <p class="eyebrow">${index < 3 ? ['🥇','🥈','🥉'][index] + ' ' : ''}${escapeHtml(item.label)} — ${item.score}/100</p>
            <h3>${escapeHtml(item.speakerName)}</h3>
            <div class="record-meta">${item.congregationName ? escapeHtml(item.congregationName) + '<br>' : ''}${item.reasons.slice(0, 2).map(reason => '✓ ' + escapeHtml(reason)).join('<br>')}${item.cautions.length ? '<br>' + item.cautions.slice(0, 1).map(reason => '⚠ ' + escapeHtml(reason)).join('<br>') : ''}</div>
          </div>
          <div class="record-actions"><button type="button" class="secondary-button" data-select-recommended-speaker="${escapeHtml(item.speakerId)}">Choisir</button></div>
        </article>`).join('')}</div>`;
  }

  async function openPlanning(item) {
    try {
      if (!state.planningOptions.speakers.length) await loadPlanningOptions();
      const form = document.getElementById('planning-form');
      ensurePlanningVersionField_();
      fillForm(form, item);
      form.elements.version.value = item ? item.version || '' : '';
      form.elements.status.value = item ? item.status : 'PROGRAMME';
      if (!item) {
        form.elements.time.value = '10:00';
        const today = new Date();
        form.elements.date.value = today.toISOString().slice(0, 10);
      }
      document.getElementById('planning-warning').hidden = true;
      if (typeof clearPlanningConflictResolution_ === 'function') clearPlanningConflictResolution_();
      ensureRecommendationPanel_();
      document.getElementById('planning-dialog').showModal();
      await refreshSpeakerRecommendations_();
    } catch (error) { showError(error); }
  }

  async function handlePlanningServerResult_(form, result, confirmWarnings) {
    if (result.blocked) {
      const warning = document.getElementById('planning-warning');
      warning.innerHTML = '<strong>Programmation impossible</strong><ul>' + (result.errors || []).map(item => `<li>${escapeHtml(item)}</li>`).join('') + '</ul>';
      warning.hidden = false;
      if (typeof renderPlanningConflictResolution_ === 'function') renderPlanningConflictResolution_(result.resolution || {});
      return result;
    }
    if (result.requiresConfirmation) {
      if (typeof clearPlanningConflictResolution_ === 'function') clearPlanningConflictResolution_();
      const warning = document.getElementById('planning-warning');
      warning.innerHTML = '<strong>Attention</strong><ul>' + result.warnings.map(item => `<li>${escapeHtml(item)}</li>`).join('') + '</ul>';
      warning.hidden = false;
      if (window.confirm(result.warnings.join('\n') + '\n\nSouhaites-tu quand même enregistrer cette programmation ?')) {
        return submitPlanning(form, true);
      }
      return result;
    }
    if (typeof clearPlanningConflictResolution_ === 'function') clearPlanningConflictResolution_();
    document.getElementById('planning-dialog').close();
    toast(result.warnings && result.warnings.length ? 'Programmation enregistrée avec alerte.' : 'Programmation enregistrée.');
    await loadPlannings();
    return result;
  }

  async function submitPlanning(form, confirmWarnings) {
    const payload = formToObject(form);
    try {
      const result = await runServer('savePlanning', payload, Boolean(confirmWarnings));
      return handlePlanningServerResult_(form, result, confirmWarnings);
    } catch (error) {
      if (!isPlanningVersionConflict_(error)) throw error;
      return handleConcurrentFormConflict_(form, payload, {
        onSaved: async () => {
          document.getElementById('planning-dialog').close();
          await loadPlannings();
        },
        onValidation: async response => {
          applyConcurrentMergeCandidateToForm_(form, response.candidate || {}, response.remote || {}, response.remoteVersion || '');
          await refreshSpeakerRecommendations_();
          await handlePlanningServerResult_(form, response.validation, confirmWarnings);
        }
      }, { confirmWarnings: Boolean(confirmWarnings) });
    }
  }

  document.addEventListener('click', async event => {
    const navigation = event.target.closest('[data-view="planning"], [data-open="planning"]');
    if (navigation) {
      if (!state.planningOptions.speakers.length) await loadPlanningOptions();
      await loadPlannings();
    }
    if (event.target.id === 'new-planning') await openPlanning();

    const recommended = event.target.closest('[data-select-recommended-speaker]');
    if (recommended) {
      const form = document.getElementById('planning-form');
      form.elements.speakerId.value = recommended.dataset.selectRecommendedSpeaker;
      if (typeof clearPlanningConflictResolution_ === 'function') clearPlanningConflictResolution_();
      toast('Orateur recommandé sélectionné.');
    }

    const edit = event.target.closest('[data-edit-planning]');
    if (edit) await openPlanning(state.plannings.find(item => item.id === edit.dataset.editPlanning));

    const toggle = event.target.closest('[data-toggle-planning]');
    if (toggle) {
      const item = state.plannings.find(entry => entry.id === toggle.dataset.togglePlanning);
      const nextStatus = toggle.dataset.status === 'ANNULE' ? 'PROGRAMME' : 'ANNULE';
      try {
        await runServer(nextStatus === 'PROGRAMME' ? 'restorePlanning' : 'cancelPlanning', item.id, toggle.dataset.version);
        toast(nextStatus === 'PROGRAMME' ? 'Programmation restaurée.' : 'Programmation annulée.');
        await loadPlannings();
      } catch (error) {
        if (isPlanningVersionConflict_(error) && item) {
          await handleConcurrentMerge_({
            entity: 'PROGRAMMATION', entityId: item.id, base: item,
            local: Object.assign({}, item, { status: nextStatus }), operation: 'STATUS',
            onSaved: loadPlannings
          });
        } else showError(error);
      }
    }
  });

  document.getElementById('planning-form').addEventListener('submit', async event => {
    event.preventDefault();
    try { await submitPlanning(event.target, false); } catch (error) { showError(error); }
  });

  document.getElementById('planning-form').addEventListener('change', event => {
    if (event.target.name === 'date' || event.target.name === 'talkNumber') refreshSpeakerRecommendations_();
  });

  debounce('planning-search', loadPlannings);
  document.getElementById('planning-cancelled').addEventListener('change', loadPlannings);

  document.addEventListener('DOMContentLoaded', async () => {
    ensurePlanningVersionField_();
    try { await loadPlanningOptions(); } catch (error) { showError(error); }
  });
</script>
