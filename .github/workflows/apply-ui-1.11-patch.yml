name: Appliquer le lot ergonomie 1.11

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/mobile-accessibility-performance'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-accessibility-performance
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruire et vérifier le patch
        run: |
          set -euo pipefail
          test -f .github/patches/ui-1.11.part.00
          test -f .github/patches/ui-1.11.part.01
          test -f .github/patches/ui-1.11.part.02
          test -f .github/patches/ui-1.11.part.03
          test -f .github/patches/ui-1.11.part.04
          test -f .github/patches/ui-1.11.part.05
          cat .github/patches/ui-1.11.part.00 \
              .github/patches/ui-1.11.part.01 \
              .github/patches/ui-1.11.part.02 \
              .github/patches/ui-1.11.part.03 \
              .github/patches/ui-1.11.part.04 \
              .github/patches/ui-1.11.part.05 > /tmp/ui.patch.gz.b64
          base64 --decode /tmp/ui.patch.gz.b64 > /tmp/ui.patch.gz
          gzip --decompress --stdout /tmp/ui.patch.gz > /tmp/ui.patch
          echo "05d4708a4c9729d13d38e46c7e1379fb9f27b97dddfb2e7dc96634451946f082  /tmp/ui.patch" | sha256sum --check
          wc -c /tmp/ui.patch

      - name: Vérifier l’applicabilité du patch
        run: |
          set -euo pipefail
          if git apply --check --verbose /tmp/ui.patch; then
            echo "PATCH_MODE=APPLY" >> "$GITHUB_ENV"
          elif git apply --reverse --check --verbose /tmp/ui.patch; then
            echo "PATCH_MODE=ALREADY_APPLIED" >> "$GITHUB_ENV"
          else
            echo "Le patch n’est ni applicable ni déjà présent."
            exit 1
          fi

      - name: Appliquer le patch
        if: env.PATCH_MODE == 'APPLY'
        run: git apply --index --verbose /tmp/ui.patch

      - name: Exécuter les huit suites de contrôle
        run: npm run check

      - name: Retirer les fichiers temporaires
        run: git rm .github/patches/ui-1.11.part.* .github/workflows/apply-ui-1.11-patch.yml

      - name: Enregistrer et publier le lot 1.11
        run: |
          set -euo pipefail
          git config user.name "CoordoDiscours CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: improve mobile accessibility and client caching"
          git push origin HEAD:agent/mobile-accessibility-performance
