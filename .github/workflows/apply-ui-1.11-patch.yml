name: Appliquer le lot ergonomie 1.11

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/mobile-accessibility-performance'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-accessibility-performance
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Appliquer, tester et publier le lot 1.11
        run: |
          set -euo pipefail
          if ! compgen -G ".github/patches/ui-1.11.part.*" > /dev/null; then
            echo "Le patch a déjà été appliqué et nettoyé."
            exit 0
          fi
          cat .github/patches/ui-1.11.part.* > /tmp/ui.patch.gz.b64
          base64 --decode /tmp/ui.patch.gz.b64 > /tmp/ui.patch.gz
          gzip --decompress --stdout /tmp/ui.patch.gz > /tmp/ui.patch
          echo "05d4708a4c9729d13d38e46c7e1379fb9f27b97dddfb2e7dc96634451946f082  /tmp/ui.patch" | sha256sum --check
          if git apply --check /tmp/ui.patch; then
            git apply --index /tmp/ui.patch
          elif git apply --reverse --check /tmp/ui.patch; then
            echo "Le patch est déjà présent dans la branche."
          else
            echo "Le patch n’est ni applicable ni déjà présent."
            exit 1
          fi
          npm run check
          git rm .github/patches/ui-1.11.part.* .github/workflows/apply-ui-1.11-patch.yml
          git config user.name "CoordoDiscours CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: improve mobile accessibility and client caching"
          git push origin HEAD:agent/mobile-accessibility-performance
