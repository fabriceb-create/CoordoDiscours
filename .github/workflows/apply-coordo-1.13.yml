name: Appliquer CoordoDiscours 1.13

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: coordodiscours-1-13-apply
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/release-readiness-health'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche
        uses: actions/checkout@v4
        with:
          ref: agent/release-readiness-health
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruire et vérifier le lot 1.13
        run: |
          set -euo pipefail
          cat .github/patches/coordo-1.13.xz.* > /tmp/coordo-1.13.patch.xz.b64
          echo "d4b1b7693b24e8d2805388f005ff7597de05f512f41201b823c58fa90fba0f6c  /tmp/coordo-1.13.patch.xz.b64" | sha256sum --check
          base64 --decode /tmp/coordo-1.13.patch.xz.b64 > /tmp/coordo-1.13.patch.xz
          echo "3750b7d2f69f8c0fcba6af422943f68e68b9690ddc08d17057fd8eb0991d39b1  /tmp/coordo-1.13.patch.xz" | sha256sum --check
          xz --decompress --stdout /tmp/coordo-1.13.patch.xz > /tmp/coordo-1.13.patch
          echo "32f1b4df9b08155b1d3ea3a0970e44fa9f6d1dee105eede995201dd4eea6b388  /tmp/coordo-1.13.patch" | sha256sum --check

      - name: Appliquer le code 1.13
        run: |
          set -euo pipefail
          if git apply --check /tmp/coordo-1.13.patch; then
            git apply --index /tmp/coordo-1.13.patch
            git restore --staged .github/workflows/validate.yml
            git restore .github/workflows/validate.yml
            echo "APPLIED=true" >> "$GITHUB_ENV"
          elif git apply --reverse --check /tmp/coordo-1.13.patch; then
            echo "Le lot est déjà présent."
            echo "APPLIED=false" >> "$GITHUB_ENV"
          else
            echo "Le lot 1.13 n’est ni applicable ni déjà présent."
            exit 1
          fi

      - name: Exécuter les dix suites de contrôle
        run: npm run check

      - name: Contrôler le pré-déploiement
        run: node scripts/predeploy-check.mjs

      - name: Publier le commit 1.13
        if: env.APPLIED == 'true'
        run: |
          git config user.name "CoordoDiscours CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: add release readiness health and guided acceptance"
          git push origin HEAD:agent/release-readiness-health
