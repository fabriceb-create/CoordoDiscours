name: Appliquer CoordoDiscours 1.12

on:
  push:
    branches:
      - agent/help-observability-reliability
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.head_ref == 'agent/help-observability-reliability'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche
        uses: actions/checkout@v4
        with:
          ref: agent/help-observability-reliability
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruire et vérifier le lot 1.12
        run: |
          set -euo pipefail
          cat .github/patches/coordo-1.12.xz.* > /tmp/coordo-1.12.patch.xz.b64
          base64 --decode /tmp/coordo-1.12.patch.xz.b64 > /tmp/coordo-1.12.patch.xz
          echo "c7c48dc0623e74bfcd350391373f556620b93630282108d508e0c6651a0c93d0  /tmp/coordo-1.12.patch.xz" | sha256sum --check
          xz --decompress --stdout /tmp/coordo-1.12.patch.xz > /tmp/coordo-1.12.patch
          echo "da773e6d66649fe7d6f5fd75a34cb97aea3e89af256d46f2f3ee40132194335e  /tmp/coordo-1.12.patch" | sha256sum --check

      - name: Appliquer le code 1.12
        run: |
          set -euo pipefail
          if git apply --check /tmp/coordo-1.12.patch; then
            git apply --index /tmp/coordo-1.12.patch
            echo "APPLIED=true" >> "$GITHUB_ENV"
          elif git apply --reverse --check /tmp/coordo-1.12.patch; then
            echo "Le lot est déjà présent."
            echo "APPLIED=false" >> "$GITHUB_ENV"
          else
            echo "Le lot 1.12 n’est ni applicable ni déjà présent."
            exit 1
          fi

      - name: Exécuter les neuf suites de contrôle
        run: npm run check

      - name: Contrôler le pré-déploiement
        run: node scripts/predeploy-check.mjs

      - name: Publier le commit 1.12
        if: env.APPLIED == 'true'
        run: |
          git config user.name "CoordoDiscours CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: add contextual help, observability and reliability"
          git push origin HEAD:agent/help-observability-reliability
