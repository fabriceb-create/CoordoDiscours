name: Appliquer CoordoDiscours 1.14

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: coordodiscours-1-14-apply
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/release-governance-corrective-actions'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche
        uses: actions/checkout@v4
        with:
          ref: agent/release-governance-corrective-actions
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruire et vérifier le lot 1.14
        run: |
          set -euo pipefail
          cat .github/patches/release-governance.part.* > /tmp/release-governance.patch.xz.b64
          base64 --decode /tmp/release-governance.patch.xz.b64 > /tmp/release-governance.patch.xz
          echo "e6507a6d54fbcac031cf73753706aeb2165b286ff4a1e97c72998c6d81eba4ab  /tmp/release-governance.patch.xz" | sha256sum --check
          xz --decompress --stdout /tmp/release-governance.patch.xz > /tmp/release-governance.patch
          echo "208c5956794604d85d01304176544b6e472454b681f0ba19716cafe2fec99873  /tmp/release-governance.patch" | sha256sum --check

      - name: Appliquer le code 1.14
        run: |
          set -euo pipefail
          if git apply --check /tmp/release-governance.patch; then
            git apply --index /tmp/release-governance.patch
            git restore --staged .github/workflows/validate.yml
            git restore .github/workflows/validate.yml
            echo "APPLIED=true" >> "$GITHUB_ENV"
          elif git apply --reverse --check /tmp/release-governance.patch; then
            echo "Le lot est déjà présent."
            echo "APPLIED=false" >> "$GITHUB_ENV"
          else
            echo "Le lot 1.14 n’est ni applicable ni déjà présent."
            exit 1
          fi

      - name: Exécuter les onze suites de contrôle
        run: npm run check

      - name: Contrôler le pré-déploiement
        run: node scripts/predeploy-check.mjs

      - name: Nettoyer et publier le commit 1.14
        if: env.APPLIED == 'true'
        run: |
          git rm .github/patches/release-governance.part.* .github/workflows/apply-release-governance.yml
          git config user.name "CoordoDiscours CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: add release governance and corrective actions"
          git push origin HEAD:agent/release-governance-corrective-actions
