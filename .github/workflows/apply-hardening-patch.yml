name: Appliquer le lot de durcissement 1.10

on:
  push:
    branches:
      - agent/version-history-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche
        uses: actions/checkout@v4
        with:
          ref: agent/version-history-hardening
          fetch-depth: 0

      - name: Reconstruire et vérifier le patch
        run: |
          cat .github/patches/hardening.part.* > /tmp/hardening.patch.gz.b64
          base64 --decode /tmp/hardening.patch.gz.b64 > /tmp/hardening.patch.gz
          gzip --decompress --stdout /tmp/hardening.patch.gz > /tmp/hardening.patch
          echo "3f51b10534b045615b07e41a9b6bf0f24c8f7ea51c335b601594ecaae1f2b337  /tmp/hardening.patch" | sha256sum --check

      - name: Appliquer le lot 1.10
        run: git apply --index /tmp/hardening.patch

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Exécuter tous les contrôles
        run: npm run check

      - name: Retirer les fichiers temporaires
        run: git rm .github/patches/hardening.part.* .github/workflows/apply-hardening-patch.yml

      - name: Enregistrer le lot 1.10
        run: |
          git config user.name "CoordoDiscours CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: harden version history for large datasets"
          git push origin HEAD:agent/version-history-hardening
